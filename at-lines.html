  const COLOR = { bg: "#111111", grey: "#4a4a4a", blue: "#2A79FF" };

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);

  const MIN_A = Math.atan2(0 - O.y, 0 - O.x) - 0.02;   // steepest ray that still hits the frame (top-left)

  function seg(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

  // Stroke a ray from the vanishing point between distances d0..d1.
  function ray(ux, uy, d0, d1) { seg(O.x + ux * d0, O.y + uy * d0, O.x + ux * d1, O.y + uy * d1); }

  // Gradient segment along a ray, transparent at d0 → color at d1.
  function gradRay(ux, uy, d0, d1, rgb, alpha, width) {
    if (d1 <= d0) return;
    const x0 = O.x + ux * d0, y0 = O.y + uy * d0, x1 = O.x + ux * d1, y1 = O.y + uy * d1;
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},0)`);
    g.addColorStop(1, `rgba(${rgb},${alpha})`);
    ctx.strokeStyle = g; ctx.lineWidth = width;
    seg(x0, y0, x1, y1);
  }

  function lineState(tm, t) {
    const local = (((t - tm.phase) % LOOP) + LOOP) % LOOP;
    const a = tm.grow, b = a + tm.hold, c = b + tm.retract, d = c + tm.fade;
    if (local < a) return { head: easeOutCubic(local / a), tail: 0, at: 0, pop: 0, growing: true };
    const pop = clamp01((local - a) / 0.35);
    if (local < b) return { head: 1, tail: 0, at: pop, pop };
    if (local < c) return { head: 1, tail: easeInOutCubic((local - b) / tm.retract), at: 1, pop: 1 };
    if (local < d) return { head: 1, tail: 1, at: 1 - (local - c) / tm.fade, pop: 1 };
    return null;
  }

  function render(t) {
    ctx.fillStyle = COLOR.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = "round";

    // Streak field
    for (const s of streaks) {
      ctx.strokeStyle = `rgba(255,255,255,${s.alpha})`;
      ctx.lineWidth = s.width;
      ray(Math.cos(s.a), Math.sin(s.a), 0, 2800);
    }
    for (const g of glints) {
      const ux = Math.cos(g.a), uy = Math.sin(g.a);
      const d0 = -O.x / ux, d1 = 2700;                       // from the left edge to off-frame
      const p = ((t / g.period + g.off) % 1);
      const head = d0 + p * (d1 - d0 + g.len);
      gradRay(ux, uy, head - g.len, head, "255,255,255", 0.16, 1.6);
    }

    // Terminal lines + their @
    const ats = [];
    for (let i = 0; i < terminals.length; i++) {
      const tm = terminals[i];
      const st = lineState(tm, t);
      if (!st) continue;
      const logo = assign[cycleOf(tm, t)][i];
      let end = tm.end;
      if (logo >= 0 && logoImgs[logo].naturalWidth) {
        // stop where the ray meets the logo's box edge, plus a small gap
        const { w, h } = logoFit(logoImgs[logo]);
        end = tm.D - (Math.min(w / 2 / Math.abs(tm.ux || 1e-6), h / 2 / Math.abs(tm.uy || 1e-6)) + 10);
      }
      const blue = tm.blue && logo < 0;
      const dHead = end * st.head, dTail = end * st.tail;
      if (dHead - dTail > 1) {
        ctx.strokeStyle = "rgba(255,255,255,0.10)";
        ctx.lineWidth = 1.8;
        ray(tm.ux, tm.uy, dTail, dHead);
        if (tm.companion) {
          const a = Math.atan2(tm.uy, tm.ux) + tm.companion.da;
          ctx.strokeStyle = "rgba(255,255,255,0.06)";
          ctx.lineWidth = 1.3;
          ray(Math.cos(a), Math.sin(a), dTail * tm.companion.k, dHead * tm.companion.k);
        }
        const rgb = blue ? "42,121,255" : "210,210,210";
        if (st.growing) {
          gradRay(tm.ux, tm.uy, Math.max(dTail, dHead - 150), dHead, rgb, blue ? 0.9 : 0.5, 2.2);   // bright travelling head
        } else if (blue) {
          gradRay(tm.ux, tm.uy, Math.max(dTail, end - 220), end, rgb, 0.32, 1.8);                    // blue tint into the @
        }
      }
      if (st.at > 0) ats.push({ tm, logo, blue, alpha: st.at, scale: 0.7 + 0.3 * easeOutBack(st.pop) });
    }

    ctx.font = AT_FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.imageSmoothingQuality = "high";
    for (const { tm, logo, blue, alpha, scale } of ats) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(tm.ex, tm.ey);
      ctx.scale(scale, scale);
      const im = logo >= 0 ? logoImgs[logo] : null;
      if (im && im.naturalWidth) {                       // project logo: original colors, no tile
        const { w, h } = logoFit(im);
        ctx.drawImage(im, -w / 2, -h / 2, w, h);
        ctx.restore();
        continue;
      }
      if (blue) { ctx.shadowColor = "rgba(42,121,255,0.45)"; ctx.shadowBlur = 16; }
      ctx.fillStyle = blue ? COLOR.blue : COLOR.grey;
      ctx.fillText("@", 0, 0);
      ctx.restore();
    }
  }

  window.renderFrame = render;          // used by the MP4 exporter
  window.LOOP_SECONDS = MASTER;
  // Resolves once every logo has decoded; the exporter awaits it before capturing.
  window.logosReady = Promise.all(logoImgs.map((im) => im.decode().catch(() => {})));

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  window.logosReady.then(() => {
    if (reduced.matches || params.has("still")) { render(+params.get("still") || 3.5); return; }
    const start = performance.now();
    function frame(now) {
      render(((now - start) / 1000) % MASTER);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
